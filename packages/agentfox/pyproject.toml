[project]
name = "agentfox"
version = "4.3.1"
description = "Core library for the agent-fox autonomous coding-agent orchestrator"
requires-python = ">=3.12"
dependencies = [
    "afaudit>=4.3.1",
    "afissues>=4.3.1",
    "afspec>=4.3.1",
    "click>=8.1",
    "pydantic>=2.13",
    "rich>=15.0",
    "anthropic[vertex,bedrock]>=0.111",
    "claude-agent-sdk>=0.2.108",
    "pyyaml>=6.0",
    "duckdb>=1.5.4",
    "sentence-transformers>=5.0",
    "scikit-learn>=1.8",
    "pathspec>=1.0",
    "tomlkit>=0.13",
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
    "tree-sitter-go>=0.25",
    "tree-sitter-rust>=0.24",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c>=0.24",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-elixir>=0.3.4",
    "tree-sitter-kotlin>=1.0",
    "tree-sitter-dart-orchard>=0.3.1",
    "tree-sitter-bash>=0.25.1",
    "tree-sitter-html>=0.23.2",
    "tree-sitter-json>=0.24.8",
    "tree-sitter-css>=0.25.0",
    "tree-sitter-regex>=0.25.0",
    "tree-sitter-swift>=0.0.1",
    "deepagents>=0.5",
    "google-adk>=2.0",
    "google-api-core>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
afaudit = { workspace = true }
afissues = { workspace = true }
afspec = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: tests that take >1s (property, integration, orchestrator, knowledge DB)",
    "smoke: end-to-end smoke tests (excluded from default test runs)",
    "ci_required: tests that MUST pass in the PR pipeline and block merge on failure (09-REQ-8.4)",
]
