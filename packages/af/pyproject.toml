[project]
name = "af"
version = "4.7.2"
description = "CLI for the agent-fox autonomous coding-agent orchestrator"
requires-python = ">=3.12"
dependencies = [
    "afaudit>=1.0.0",
    "agentfox>=4.7.2",
    "click>=8.1",
    "rich>=15.0",
    "duckdb>=1.5.5",
]

[project.scripts]
af = "af.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
afaudit = { git = "https://github.com/agent-fox-dev/af-python", subdirectory = "packages/afaudit" }
agentfox = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../agentfox"]
asyncio_mode = "auto"
