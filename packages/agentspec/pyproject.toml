[project]
name = "agentspec"
version = "4.1.17"
description = "AI-powered spec creation library"
requires-python = ">=3.12"
dependencies = [
    "afspec>=4.1.17",
    "agentfox>=4.1.17",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
afspec = { workspace = true }
agentfox = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
