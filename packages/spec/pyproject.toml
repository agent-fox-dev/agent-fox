[project]
name = "spec"
version = "0.9.0"
description = "CLI for AI-powered spec creation"
requires-python = ">=3.12"
dependencies = [
    "agentfox>=4.0.0rc2",
    "agentspec>=0.9.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
spec = "spec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
agentfox = { workspace = true }
agentspec = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
