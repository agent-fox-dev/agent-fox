[project]
name = "spec"
version = "4.1.11"
description = "CLI for AI-powered spec creation"
requires-python = ">=3.12"
dependencies = [
    "afspec>=4.1.11",
    "agentfox>=4.1.11",
    "agentspec>=4.1.11",
    "click>=8.1",
    "jsonschema>=4.0",
    "rich>=13.0",
]

[project.scripts]
spec = "spec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
afspec = { workspace = true }
agentfox = { workspace = true }
agentspec = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
