[project]
name = "agent-fox"
version = "4.3.2"
description = "Autonomous coding-agent orchestrator"
requires-python = ">=3.12"
dependencies = [
    "af>=4.3.2",
    "agentspec>=4.3.2",
    "nightshift>=4.3.2",
    "spec>=4.3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "hypothesis>=6.0",
    "ruff>=0.15",
    "mypy>=1.20",
    "types-pyyaml>=6.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["packages/agentfox/tests", "packages/af/tests", "packages/afaudit/tests", "packages/afissues/tests", "packages/afspec/tests", "packages/agentspec/tests", "packages/nightshift/tests"]
pythonpath = ["packages/agentfox"]
asyncio_mode = "auto"
addopts = "-n auto --dist=loadfile --timeout=15 -m 'not smoke' --import-mode=importlib"
markers = [
    "property: Hypothesis property-based test",
    "slow: tests that take >1s (property, integration, orchestrator); excluded by test-fast",
    "smoke: End-to-end smoke test (slow, runs full suite as subprocess)",
    "integration: Integration test requiring multiple workspace packages",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
af = { workspace = true }
afaudit = { workspace = true }
afissues = { workspace = true }
agentfox = { workspace = true }
afspec = { workspace = true }
agentspec = { workspace = true }
nightshift = { workspace = true }
spec = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".claude/worktrees"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"agentfox.knowledge.embeddings".msg = "Removed in spec 114"
"agentfox.knowledge.search".msg = "Removed in spec 114"
"agentfox.knowledge.retrieval".msg = "Removed in spec 114"
"agentfox.knowledge.causal".msg = "Removed in spec 114"
"agentfox.knowledge.lifecycle".msg = "Removed in spec 114"
"agentfox.knowledge.contradiction".msg = "Removed in spec 114"
"agentfox.knowledge.consolidation".msg = "Removed in spec 114"
"agentfox.knowledge.compaction".msg = "Removed in spec 114"
"agentfox.knowledge.entity_linker".msg = "Removed in spec 114"
"agentfox.knowledge.entity_query".msg = "Removed in spec 114"
"agentfox.knowledge.entity_store".msg = "Removed in spec 114"
"agentfox.knowledge.entities".msg = "Removed in spec 114"
"agentfox.knowledge.static_analysis".msg = "Removed in spec 114"
"agentfox.knowledge.sleep_compute".msg = "Removed in spec 114"
"agentfox.knowledge.rendering".msg = "Removed in spec 114"
"agentfox.knowledge.store".msg = "Removed in spec 114"
"agentfox.knowledge.facts".msg = "Removed in spec 114"
"agentfox.knowledge.ingest".msg = "Removed in spec 114"
"agentfox.knowledge.onboard".msg = "Removed in spec 114"
"agentfox.engine.knowledge_harvest".msg = "Removed in spec 114"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
exclude = [".claude/worktrees"]
