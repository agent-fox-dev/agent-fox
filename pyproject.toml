[project]
name = "agent-fox"
version = "4.0.0-rc1"
description = "Autonomous coding-agent orchestrator"
requires-python = ">=3.12"
dependencies = [
    "af>=4.0.0rc1",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "hypothesis>=6.0",
    "ruff>=0.15",
    "mypy>=1.20",
    "types-pyyaml>=6.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["packages/agentfox/tests", "packages/af/tests"]
pythonpath = ["packages/agentfox"]
asyncio_mode = "auto"
addopts = "-n auto"
markers = [
    "property: Hypothesis property-based test",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
af = { workspace = true }
agentfox = { workspace = true }
afspec = { path = "../af-core/packages/afspec" }

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".claude/worktrees"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
exclude = [".claude/worktrees"]
