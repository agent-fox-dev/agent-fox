## agent-fox local configuration
## Generated by agent-fox 4.0.2
##
## Override global settings per-repository by uncommenting
## the values you want to change.  Sections present here
## replace the corresponding global section wholesale.

# [paths]
## Spec root directory relative to project root (default: ".agent-fox/specs")
# spec_root = ".agent-fox/specs"

# [workspace]
## Automatically remove untracked files and reset dirty index before session dispatch instead of aborting. (default: false)
# force_clean = false
## Git branch used as the integration target for all merges. (default: "main")
# integration_branch = "main"

# [orchestrator]
## Maximum parallel sessions (1-8, default: 2)
# parallel = 2
## Sync interval in task groups (>=0, default: 5)
# sync_interval = 5
## Hot-load specs between sessions (default: true)
# hot_load = true
## Maximum retries per task group (>=0, default: 2)
# max_retries = 2
## Session timeout in minutes (>=1, default: 45)
# session_timeout = 45
## Delay between sessions in seconds (>=0, default: 3)
# inter_session_delay = 3
## Maximum cost limit (not set by default)
## max_cost =
## Maximum number of sessions (not set by default)
## max_sessions =
## Maximum number of runs to retain in the audit log (>=1, default: 20)
# audit_retention_runs = 20
## Stop the run when this fraction of nodes are blocked (0.0-1.0). None = disabled. (not set by default)
## max_blocked_fraction =
## Maximum fraction of parallel slots that may be occupied by review archetype sessions (0.0-1.0). auto_pre (group 0) nodes are exempt. Default 0.34 means at most ~1/3 of slots for reviews. (default: 0.34)
# max_review_fraction = 0.34
## Maximum USD spend per session, 0 = unlimited (default: 20.0)
# max_budget_usd = 20.0
## Seconds between watch polls when --watch is active. Values below 10 are clamped to 10. (>=10, default: 60)
# watch_interval = 60

# [routing]
## Maximum timeout retries before falling through to failure handler (>=0, default: 2)
# max_timeout_retries = 2
## Factor by which max_turns and session_timeout are extended on timeout retry (>=1.0, default: 1.5)
# timeout_multiplier = 1.5
## Maximum session_timeout as a factor of the original configured value (>=1.0, default: 2.0)
# timeout_ceiling_factor = 2.0

# [security]
## Allowed bash commands (not set by default)
## bash_allowlist =
## Additional allowed bash commands (default: [])
# bash_allowlist_extend = []

# [theme]
## Enable playful output style (default: true)
# playful = true
## Header text style (default: "bold #ff8c00")
# header = "bold #ff8c00"
## Success text style (default: "bold green")
# success = "bold green"
## Error text style (default: "bold red")
# error = "bold red"
## Warning text style (default: "bold yellow")
# warning = "bold yellow"
## Info text style (default: "#daa520")
# info = "#daa520"
## Tool text style (default: "bold #cd853f")
# tool = "bold #cd853f"
## Muted text style (default: "dim")
# muted = "dim"

# [platform]
## Platform type (none or github) (default: "none")
# type = "none"
## Issue tracker URL (defaults from type) (default: "")
# url = ""

# [knowledge]
## Path to knowledge store (default: ".agent-fox/knowledge.duckdb")
# store_path = ".agent-fox/knowledge.duckdb"

# [knowledge.provider]
## Max total retrieval items (default: 10)
# max_items = 10
## Max cross-group retrieval items (default: 3)
# max_cross_group_items = 3

# [archetypes]
## Enable coder archetype (default: true)
# coder = true
## Enable reviewer archetype (replaces skeptic, oracle, auditor) (default: true)
# reviewer = true
## Enable verifier archetype (default: true)
# verifier = true
## Per-archetype model overrides (default: {})
# models = {}
## Per-archetype command allowlists (default: {})
# allowlists = {}
## Per-archetype maximum turn limits (default: {})
# max_turns = {}
## Per-archetype extended thinking configuration (default: {})
# thinking = {}
## Unified per-archetype configuration tables. TOML: [archetypes.overrides.<name>]. Takes precedence over models/max_turns/thinking/allowlists dicts. (default: {})
# overrides = {}
## Custom archetype configurations keyed by archetype name. TOML: [archetypes.custom.<name>]. Requirements: 99-REQ-4.2 (default: {})
# custom = {}

# [archetypes.instances]
## Number of reviewer instances (replaces skeptic+auditor) (1-5, default: 1)
# reviewer = 1
## Number of verifier instances (max clamped to 1) (1, default: 1)
# verifier = 1

# [archetypes.reviewer_config]
## Finding count to block merge for pre-review mode (>=0, default: 1)
# pre_review_block_threshold = 1
## Drift count to block for drift-review mode (None = advisory only) (>=1 or None, not set by default)
## drift_review_block_threshold =
## Minimum TS entries to trigger audit-review injection (>=1, default: 5)
# audit_min_ts_entries = 5
## Maximum audit-review/coder retry iterations (>=0, default: 2)
# audit_max_retries = 2

# [pricing]
## Per-model pricing configuration (default: {claude-haiku-4-5 = {input_price_per_m = 1.0, output_price_per_m = 5.0, cache_read_price_per_m = 0.1, cache_creation_price_per_m = 1.25}, claude-sonnet-4-6 = {input_price_per_m = 3.0, output_price_per_m = 15.0, cache_read_price_per_m = 0.3, cache_creation_price_per_m = 3.75}, claude-opus-4-5 = {input_price_per_m = 5.0, output_price_per_m = 25.0, cache_read_price_per_m = 0.5, cache_creation_price_per_m = 6.25}, claude-opus-4-6 = {input_price_per_m = 5.0, output_price_per_m = 25.0, cache_read_price_per_m = 0.5, cache_creation_price_per_m = 6.25}, claude-opus-4-6[1m] = {input_price_per_m = 5.0, output_price_per_m = 25.0, cache_read_price_per_m = 0.5, cache_creation_price_per_m = 6.25}})
# models = {claude-haiku-4-5 = {input_price_per_m = 1.0, output_price_per_m = 5.0, cache_read_price_per_m = 0.1, cache_creation_price_per_m = 1.25}, claude-sonnet-4-6 = {input_price_per_m = 3.0, output_price_per_m = 15.0, cache_read_price_per_m = 0.3, cache_creation_price_per_m = 3.75}, claude-opus-4-5 = {input_price_per_m = 5.0, output_price_per_m = 25.0, cache_read_price_per_m = 0.5, cache_creation_price_per_m = 6.25}, claude-opus-4-6 = {input_price_per_m = 5.0, output_price_per_m = 25.0, cache_read_price_per_m = 0.5, cache_creation_price_per_m = 6.25}, claude-opus-4-6[1m] = {input_price_per_m = 5.0, output_price_per_m = 25.0, cache_read_price_per_m = 0.5, cache_creation_price_per_m = 6.25}}

# [planning]
## Detect file conflicts between parallel tasks (default: false)
# file_conflict_detection = false

# [caching]
## Caching policy: NONE, DEFAULT (5-min), or EXTENDED (1-hour TTL) (default: "DEFAULT")
# cache_policy = "DEFAULT"

# [night_shift]
## Seconds between issue checks (minimum 60) (default: 900)
# issue_check_interval = 900
## Push fix branches to origin before harvest (default: false)
# push_fix_branch = false

# [spec_tool]
## Anthropic model used for spec generation (default: "claude-sonnet-4-6")
# model = "claude-sonnet-4-6"
## Authentication method (empty string = default API key) (default: "")
# auth_method = ""
## Google Cloud Vertex AI project ID (default: "")
# vertex_project = ""
## Google Cloud Vertex AI region (default: "")
# vertex_region = ""
