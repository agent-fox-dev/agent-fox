## agent-fox local configuration
## Generated by agent-fox 4.2.5
## https://github.com/agent-fox-dev/agent-fox
##
## For all configuration options, see https://github.com/agent-fox-dev/agent-fox/blob/main/docs/config-reference.md
## When this file exists, the global ~/.agent-fox/config.toml
## is ignored entirely. Uncomment and edit values to customize.

[workspace]
## Post-session branch integration: 'direct' (squash-merge), 'branch' (keep locally), or 'pr' (open GitHub PR). (default: "direct")
merge_strategy = "direct"

[backend]
## Backend provider to use for agent sessions (default: "claude")
provider = "claude"

[orchestrator]
## Maximum parallel sessions (1-8, default: 2)
parallel = 2
## Maximum USD spend per session, 0 = unlimited (default: 20.0)
max_budget_usd = 20.0

[platform]
## Platform type (none, github, gitlab, or gitea) (default: "none")
type = "github"

[archetypes]
## Enable reviewer archetype (default: true)
reviewer = true
## Enable verifier archetype (default: true)
verifier = true

[archetypes.instances]
## Number of verifier instances (max clamped to 1) (1, default: 1)
verifier = 1

# Override the coder archetype model tier:
[archetypes.overrides.coder]
model_tier = "ADVANCED"

[archetypes.overrides.reviewer]
model_tier = "ADVANCED"
max_turns = 120

[archetypes.overrides.reviewer.modes.pre-review]
model_tier = "STANDARD"
max_turns = 50